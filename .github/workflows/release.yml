name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          # semantic-release 25 needs Node 22.14 or later.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Install next to the latest agentos (npm checks the peer ranges)
        run: pnpm run check:install
      # Trusted publishing needs npm 11.5.1 or later: under Node 22's npm 10 the publish ends in ENEEDAUTH
      # once a trusted publisher exists (framerslab/agentos Release run 39490192582, 20 October 2026).
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@11.20.0 && npm --version
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec semantic-release
