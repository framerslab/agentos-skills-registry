name: Links

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Links within this repository
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --hidden --no-progress
            --root-dir ${{ github.workspace }}
            --remap "^https://github\.com/framerslab/agentos-skills-registry/(blob|tree)/master/ file://${{ github.workspace }}/"
            --exclude-path CHANGELOG.md
            './*.md' './.github/**/*.md' './.github/ISSUE_TEMPLATE/*.yml'
      # --include alone limits this step to the matching links: with no --exclude,
      # lychee skips every other link, and an --exclude would end that. This
      # repository's own links are checked offline in the step above; the remap
      # turns them into file links before the filter, so this step skips them.
      # github.com answers a burst of blob requests from a runner with 504s, so
      # requests go four at a time. The retries cover 429s, timeouts and dropped
      # connections; lychee v0.24.2 does not retry a 504 (only its nightly does).
      - name: Links to other first-party repositories
        if: github.event_name != 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 4 --max-retries 5 --retry-wait-time 10
            --include '^https://github\.com/(framerslab|jddunn|manicinc)/[^/]+/(blob|tree)/'
            --remap "^https://github\.com/framerslab/agentos-skills-registry/(blob|tree)/master/ file://${{ github.workspace }}/"
            --exclude-path CHANGELOG.md
            './*.md' './.github/**/*.md' './.github/ISSUE_TEMPLATE/*.yml'
