name: Bump @framers/* deps

# Weekly cron + manual trigger. Bumps every @framers/* explicit version pin
# in package.json files to the latest npm-published version, refreshes the
# pnpm lockfile when present, bumps git submodule pointers when present,
# and opens a single Pull Request with the diff. The same workflow drops
# into every repo that depends on the agentos family.
#
# The branch is pushed and the pull request opened with FRAMERS_BUMP_TOKEN, a personal token held
# as a framerslab organization secret, never with GITHUB_TOKEN. An event that GITHUB_TOKEN causes
# starts no ordinary workflow run: a pull request a workflow opens or pushes with it gets its
# pull_request runs in an approval-required state, with no job until someone with write access
# approves them, while one opened with a personal token or a GitHub App token runs its workflows as
# any pull request does. GitHub, "Triggering a workflow from a workflow":
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
# Pull request 29 (12 October 2026) was opened and updated with GITHUB_TOKEN: the CI and Links runs
# on its head of 19 October (39209329032, 39209329218) stopped at action_required with no job, and
# every earlier bump pull request here ran CI only after a person stepped in.

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC weekly
  workflow_dispatch: {}

# The push and the pull request go through FRAMERS_BUMP_TOKEN, so the job's own GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    # FRAMERS_BUMP_TOKEN is a personal token that reaches past this repository, and a step can change
    # what a later step of its job runs, so no install script runs in this job and its third-party
    # actions are pinned to a commit, with the release that commit carries named beside it.
    steps:
      # First, before anything else runs: without the secret, create-pull-request stops with
      # "Input 'token' not supplied", but only at the last step, after the bump.
      - name: FRAMERS_BUMP_TOKEN is available
        env:
          FRAMERS_BUMP_TOKEN: ${{ secrets.FRAMERS_BUMP_TOKEN }}
        run: |
          if [ -z "$FRAMERS_BUMP_TOKEN" ]; then
            echo "::error::FRAMERS_BUMP_TOKEN is not available here; a pull request opened with GITHUB_TOKEN gets no CI job."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # master, whichever branch a manual run names: the pull request goes into master, and pins
          # bumped in another branch's manifest are not master's.
          ref: master
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Update submodules to latest (when present)
        run: |
          if [ -f .gitmodules ]; then
            git submodule update --remote --recursive
          fi

      - name: Bump @framers/* deps to latest published versions
        run: python3 .github/scripts/bump-framers-deps.py

      # A lockfile needs no install script, and the one this package has, prepare, builds dist,
      # which is never committed.
      - name: Refresh pnpm lockfile (when present)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile --ignore-scripts
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          # The personal token, so the pull request's own events start CI and Links (see the file's
          # top). branch-token defaults to it, so the branch push goes through it too.
          token: ${{ secrets.FRAMERS_BUMP_TOKEN }}
          # fix(deps), not chore(deps): the release skips chore commits, so a chore bump
          # never reached npm and consumers kept the old dependency ranges.
          commit-message: 'fix(deps): bump @framers/* deps to latest published versions'
          title: 'fix(deps): bump @framers/* deps to latest published versions'
          body: |
            Automated weekly bump of all `@framers/*` dependencies to their
            latest npm-published versions.

            Includes (when applicable):
            - `package.json` explicit-pin updates (caret semver of latest)
            - `pnpm-lock.yaml` refresh
            - Git submodule pointer updates (where the parent repo has submodules)

            Workspace `workspace:*` pins are not touched. Review the diff
            for any unexpected major-version jumps before merging.
          branch: chore/bump-framers-deps
          base: master
          delete-branch: true
          # No add-paths: a pathspec naming a file a repo doesn't commit
          # (pnpm-lock.yaml, .gitmodules) makes the action's `git add` fatal,
          # staging NOTHING - and `**/package.json` misses the root manifest.
          # Default collection stages every bump change.
